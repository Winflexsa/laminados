function nuevoRemito(){
  const opsDisponibles = state.ops.filter(op=>{
    const cons = calcularConsumosOp(op);
    if(cons.kgFinales <= 0) return false;
    const yaEntregado = state.remitos.flatMap(r=>r.lineas).filter(l=>l.opId===op.id).reduce((s,l)=>s+l.kg,0);
    return cons.kgFinales > yaEntregado;
  });
  
  if(opsDisponibles.length === 0){
    alert('No hay OPs con producto disponible para remitir.');
    return;
  }
  
  const clientes = [...new Set(opsDisponibles.map(op=>op.cliente))];
  
  let html = `<button class="modal-close" onclick="closeModal()">×</button>
    <h2>Nuevo remito</h2>
    
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Cliente</label>
        <select class="form-select" id="remCliente" onchange="actualizarOpsRemito()">
          <option value="">— Seleccionar —</option>
          ${clientes.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Número de remito</label>
        <input type="text" class="form-input" id="remNumero" placeholder="0001-00000123">
      </div>
      <div class="form-group">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-input" id="remFecha" value="${new Date().toISOString().split('T')[0]}">
      </div>
    </div>
    
    <div class="card-title" style="margin-top:14px">Productos a remitir</div>
    <div id="remOpsLista" style="margin-bottom:14px">
      <p style="color:var(--muted);font-size:13px">Seleccioná un cliente.</p>
    </div>
    
    <div class="form-group">
      <label class="form-label">Observaciones</label>
      <textarea class="form-textarea" id="remNotas" rows="2"></textarea>
    </div>
    
    <div class="form-row">
      <button class="btn" onclick="guardarRemito()">Guardar remito</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    </div>`;
  
  showModal(html, true);
}

function actualizarOpsRemito(){
  const cliente = document.getElementById('remCliente').value;
  const div = document.getElementById('remOpsLista');
  if(!cliente){
    div.innerHTML = '<p style="color:var(--muted);font-size:13px">Seleccioná un cliente.</p>';
    return;
  }
  
  const opsCliente = state.ops.filter(op=>{
    if(op.cliente !== cliente) return false;
    const cons = calcularConsumosOp(op);
    if(cons.kgFinales <= 0) return false;
    const yaEntregado = state.remitos.flatMap(r=>r.lineas).filter(l=>l.opId===op.id).reduce((s,l)=>s+l.kg,0);
    return cons.kgFinales > yaEntregado;
  });
  
  if(opsCliente.length === 0){
    div.innerHTML = '<p style="color:var(--muted);font-size:13px">No hay OPs disponibles.</p>';
    return;
  }
  
  let html = '<table class="table"><thead><tr><th><input type="checkbox" id="remTodas" onchange="toggleTodasOps()"></th><th>OP</th><th>Producto</th><th class="num">Disponible</th><th class="num">kg a remitir</th></tr></thead><tbody>';
  opsCliente.forEach(op=>{
    const cons = calcularConsumosOp(op);
    const yaEntregado = state.remitos.flatMap(r=>r.lineas).filter(l=>l.opId===op.id).reduce((s,l)=>s+l.kg,0);
    const disponible = cons.kgFinales - yaEntregado;
    html += `<tr>
      <td><input type="checkbox" class="rem-op-check" data-op-id="${op.id}" data-disponible="${disponible}"></td>
      <td>${op.numero}</td>
      <td>${op.medida}</td>
      <td class="num">${disponible.toFixed(1)} kg</td>
      <td class="num"><input type="number" class="form-input rem-op-kg" data-op-id="${op.id}" max="${disponible}" step="any" placeholder="${disponible.toFixed(1)}" style="width:100px;padding:4px 6px"></td>
    </tr>`;
  });
  html += '</tbody></table>';
  div.innerHTML = html;
}

function toggleTodasOps(){
  const checked = document.getElementById('remTodas').checked;
  document.querySelectorAll('.rem-op-check').forEach(c=>{
    c.checked = checked;
    if(checked){
      const opId = c.dataset.opId;
      const disp = c.dataset.disponible;
      const kgInput = document.querySelector(`.rem-op-kg[data-op-id="${opId}"]`);
      if(kgInput && !kgInput.value) kgInput.value = disp;
    }
  });
}

function guardarRemito(){
  const cliente = document.getElementById('remCliente').value;
  const numero = document.getElementById('remNumero').value.trim();
  const fecha = document.getElementById('remFecha').value;
  const notas = document.getElementById('remNotas').value;
  
  if(!cliente || !numero || !fecha){alert('Faltan datos'); return;}
  
  const lineas = [];
  document.querySelectorAll('.rem-op-check:checked').forEach(c=>{
    const opId = c.dataset.opId;
    const kgInput = document.querySelector(`.rem-op-kg[data-op-id="${opId}"]`);
    const kg = parseFloat(kgInput.value);
    if(kg && kg > 0){
      const op = state.ops.find(o=>o.id===opId);
      lineas.push({opId, opNumero: op.numero, medida: op.medida, kg, precioUsd: op.precioUsdKg});
    }
  });
  
  if(lineas.length === 0){alert('Seleccioná al menos una OP con kg.'); return;}
  
  state.remitos.push({
    id: uid('REM'),
    numero, cliente, fecha, lineas, notas,
    creadoPor: currentUser.nombre,
    fechaCreacion: new Date().toISOString()
  });
  saveState();
  closeModal();
  navigateTo('remitos');
}

function verRemito(id){
  const rem = state.remitos.find(r=>r.id===id);
  if(!rem) return;
  
  const kgTotal = rem.lineas.reduce((s,l)=>s+l.kg,0);
  const usdTotal = rem.lineas.reduce((s,l)=>s+l.kg*l.precioUsd,0);
  
  let html = `<button class="modal-close" onclick="closeModal()">×</button>
    <h2>Remito ${rem.numero} — ${rem.cliente}</h2>
    
    <div class="detail-grid">
      <div class="detail-item"><div class="detail-label">Fecha</div><div class="detail-value">${fmtDate(rem.fecha)}</div></div>
      <div class="detail-item"><div class="detail-label">kg total</div><div class="detail-value">${kgTotal.toFixed(1)} kg</div></div>
      <div class="detail-item"><div class="detail-label">USD total</div><div class="detail-value">${fmtUsdShort(usdTotal)}</div></div>
    </div>
    
    <div class="card-title" style="margin-top:14px">Productos</div>
    <table class="table">
      <thead><tr><th>OP</th><th>Producto</th><th class="num">kg</th><th class="num">USD/kg</th><th class="num">Subtotal</th></tr></thead>
      <tbody>
        ${rem.lineas.map(l=>`<tr><td>${l.opNumero}</td><td>${l.medida}</td><td class="num">${l.kg.toFixed(1)}</td><td class="num">${fmtUsdShort(l.precioUsd)}</td><td class="num">${fmtUsdShort(l.kg*l.precioUsd)}</td></tr>`).join('')}
      </tbody>
    </table>
    
    ${rem.notas ? `<div class="alert alert-info" style="margin-top:10px"><strong>Notas:</strong> ${rem.notas}</div>` : ''}
    
    <div class="form-row" style="margin-top:14px">
      <button class="btn" onclick="window.print()">Imprimir</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-danger" onclick="eliminarRemito('${rem.id}')" style="margin-left:auto">Eliminar</button>
    </div>`;
  
  showModal(html, true);
}

function eliminarRemito(id){
  if(!confirm('¿Eliminar este remito?')) return;
  state.remitos = state.remitos.filter(r=>r.id!==id);
  saveState();
  closeModal();
  navigateTo('remitos');
}

function renderReportes(){
  const opsCerradas = state.ops.filter(op=>op.estado==='cerrada');
  
  let html = `<h1 class="page-title">Reportes</h1>
    <p class="page-subtitle">OPs cerradas con análisis de margen real vs teórico.</p>`;
  
  if(opsCerradas.length === 0){
    html += '<div class="card"><p style="color:var(--muted);text-align:center;padding:30px">No hay OPs cerradas todavía.</p></div>';
    document.getElementById('content').innerHTML = html;
    return;
  }
  
  let totalKg = 0, totalCostoReal = 0, totalIngreso = 0;
  const data = opsCerradas.map(op=>{
    const nec = calcularNecesidades(op.producto, op.kgSolicitados);
    const real = calcularReal(op);
    if(!real) return null;
    const ingreso = real.kgFinales * op.precioUsdKg;
    totalKg += real.kgFinales;
    totalCostoReal += real.costoTotalReal;
    totalIngreso += ingreso;
    return {
      op, nec, real, ingreso,
      margenReal: ingreso > 0 ? (ingreso - real.costoTotalReal) / ingreso : 0,
      margenTeorico: (op.precioUsdKg - nec.costoTotalKg) / op.precioUsdKg,
      desvCosto: (real.costoUnitarioReal / nec.costoTotalKg) - 1
    };
  }).filter(d=>d);
  
  const margenPromedio = totalIngreso > 0 ? (totalIngreso - totalCostoReal) / totalIngreso : 0;
  
  html += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">OPs cerradas</div><div class="kpi-value">${opsCerradas.length}</div></div>
    <div class="kpi"><div class="kpi-label">kg producidos</div><div class="kpi-value">${totalKg.toFixed(0)}</div></div>
    <div class="kpi green"><div class="kpi-label">Ingreso total</div><div class="kpi-value">${fmtUsdShort(totalIngreso)}</div></div>
    <div class="kpi blue"><div class="kpi-label">Margen real promedio</div><div class="kpi-value">${fmtPct(margenPromedio)}</div></div>
  </div>`;
  
  html += `<div class="form-row" style="margin-bottom:14px">
    <button class="btn btn-secondary" onclick="exportarCsv()">Exportar CSV</button>
  </div>`;
  
  html += `<div class="card">
    <div class="card-title">Detalle de OPs cerradas</div>
    <table class="table">
      <thead><tr>
        <th>OP</th><th>Cliente</th><th>Producto</th>
        <th class="num">kg</th>
        <th class="num">Costo teórico</th><th class="num">Costo real</th><th class="num">Δ</th>
        <th class="num">M. teórico</th><th class="num">M. real</th>
      </tr></thead>
      <tbody>
        ${data.sort((a,b)=>new Date(b.op.fechaCierre)-new Date(a.op.fechaCierre)).map(d=>{
          const cls_costo = d.desvCosto > 0.05 ? 'deviation-bad' : d.desvCosto < -0.05 ? 'deviation-good' : 'deviation-neutral';
          const cls_margen = d.margenReal < d.margenTeorico - 0.03 ? 'deviation-bad' : d.margenReal > d.margenTeorico + 0.03 ? 'deviation-good' : 'deviation-neutral';
          return `<tr class="row-clickable" onclick="verOp('${d.op.id}')">
            <td><strong>${d.op.numero}</strong></td>
            <td>${d.op.cliente}</td>
            <td>${d.op.medida}</td>
            <td class="num">${d.real.kgFinales.toFixed(0)}</td>
            <td class="num">${fmtUsd(d.nec.costoTotalKg)}</td>
            <td class="num">${fmtUsd(d.real.costoUnitarioReal)}</td>
            <td class="num ${cls_costo}">${(d.desvCosto*100).toFixed(1)}%</td>
            <td class="num">${fmtPct(d.margenTeorico)}</td>
            <td class="num ${cls_margen}"><strong>${fmtPct(d.margenReal)}</strong></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
  
  document.getElementById('content').innerHTML = html;
}

function exportarCsv(){
  const opsCerradas = state.ops.filter(op=>op.estado==='cerrada');
  let csv = 'OP;Cliente;Producto;Fecha cierre;kg solicitados;kg finales;Costo PET teorico;Costo PET real;Costo PE teorico;Costo PE real;Costo total teorico;Costo total real;Costo /kg teorico;Costo /kg real;Precio venta /kg;Margen teorico;Margen real\n';
  opsCerradas.forEach(op=>{
    const nec = calcularNecesidades(op.producto, op.kgSolicitados);
    const real = calcularReal(op);
    if(!real) return;
    const ingreso = real.kgFinales * op.precioUsdKg;
    const margenReal = ingreso > 0 ? (ingreso - real.costoTotalReal) / ingreso : 0;
    const margenTeorico = (op.precioUsdKg - nec.costoTotalKg) / op.precioUsdKg;
    csv += `${op.numero};${op.cliente};${op.medida};${fmtDate(op.fechaCierre)};${op.kgSolicitados};${real.kgFinales};${nec.costoPetTotal.toFixed(2)};${real.costoPetReal.toFixed(2)};${nec.costoPeTotal.toFixed(2)};${real.costoPeReal.toFixed(2)};${nec.costoTotal.toFixed(2)};${real.costoTotalReal.toFixed(2)};${nec.costoTotalKg.toFixed(4)};${real.costoUnitarioReal.toFixed(4)};${op.precioUsdKg};${(margenTeorico*100).toFixed(1)}%;${(margenReal*100).toFixed(1)}%\n`;
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `winflex_ops_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
}

// MODO GESTIÓN — Config

function renderConfig(){
  const c = state.config;
  
  // Lista de operarios
  const operarios = Object.entries(state.pins).filter(([pin,u])=>u.modo==='operario');
  
  let html = `<h1 class="page-title">Configuración</h1>
    <p class="page-subtitle">Parámetros del sistema y gestión de usuarios.</p>
    
    <div class="card">
      <div class="card-title">Costos base</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Tipo de cambio (ARS/USD)</label><input type="number" class="form-input" id="cfgTc" value="${c.tc}" step="any"></div>
        <div class="form-group"><label class="form-label">Costo PET con flete (USD/kg)</label><input type="number" class="form-input" id="cfgCostoPet" value="${c.costoPet}" step="any"></div>
        <div class="form-group"><label class="form-label">Costo PE (USD/kg)</label><input type="number" class="form-input" id="cfgCostoPe" value="${c.costoPe}" step="any"></div>
        <div class="form-group"><label class="form-label">Costo proceso (USD/kg)</label><input type="number" class="form-input" id="cfgCostoProc" value="${c.costoProceso}" step="any"></div>
        <div class="form-group"><label class="form-label">Capacidad laminadora (kg/h)</label><input type="number" class="form-input" id="cfgCapLam" value="${c.capacidadLaminadora}" step="any"></div>
        <div class="form-group"><label class="form-label">Capacidad refiladora (kg/h)</label><input type="number" class="form-input" id="cfgCapRef" value="${c.capacidadRefiladora}" step="any"></div>
        <div class="form-group"><label class="form-label">Peso del cono default (kg)</label><input type="number" class="form-input" id="cfgPesoCono" value="${c.pesoConoDefault}" step="any"></div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">Mails</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Mail Agustín</label><input type="email" class="form-input" id="cfgMailAg" value="${c.mailAgustin}"></div>
        <div class="form-group"><label class="form-label">Mail Jonathan</label><input type="email" class="form-input" id="cfgMailJo" value="${c.mailJonathan}"></div>
      </div>
    </div>
    
    <div class="card">
      <div class="card-title">Alertas</div>
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Días sin avance para alertar</label><input type="number" class="form-input" id="cfgDiasAlerta" value="${c.diasAlertaOp}"></div>
        <div class="form-group"><label class="form-label">% desviación para alertar</label><input type="number" class="form-input" id="cfgPctAlerta" value="${c.pctAlertaDesviacion}" step="0.01"></div>
      </div>
    </div>
    
    <div class="form-row" style="margin-top:14px">
      <button class="btn" onclick="guardarConfig()">Guardar configuración</button>
    </div>
    
    <div class="card" style="margin-top:18px">
      <div class="card-title">Operarios</div>
      <table class="table">
        <thead><tr><th>Nombre</th><th>PIN</th><th></th></tr></thead>
        <tbody>
        ${operarios.map(([pin,u])=>`<tr>
          <td>${u.nombre}</td>
          <td><strong style="font-family:'Courier New',monospace">${pin}</strong></td>
          <td><button class="btn-icon" onclick="eliminarOperario('${pin}')">×</button></td>
        </tr>`).join('')}
        </tbody>
      </table>
      <div class="form-row" style="margin-top:14px">
        <button class="btn btn-secondary" onclick="mostrarAgregarOperarioConfig()">+ Agregar operario</button>
      </div>
    </div>
    
    <div class="card" style="margin-top:18px">
      <div class="card-title">Datos del sistema</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
        OCs: ${state.ocs.length} · OPs: ${state.ops.length} · Bobinas registradas: ${contarBobinasTotales()} · Remitos: ${state.remitos.length}
      </p>
      <div class="form-row">
        <button class="btn btn-secondary" onclick="exportarBackup()">Exportar backup JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Importar backup</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarBackup(event)">
        <button class="btn btn-danger" onclick="resetearDatos()" style="margin-left:auto">Resetear todo</button>
      </div>
    </div>`;
  
  document.getElementById('content').innerHTML = html;
}

function mostrarAgregarOperarioConfig(){
  mostrarAgregarOperario();
}

function eliminarOperario(pin){
  if(!confirm(`¿Eliminar operario con PIN ${pin}?`)) return;
  delete state.pins[pin];
  saveState();
  navigateTo('config');
}

function guardarConfig(){
  state.config.tc = parseFloat(document.getElementById('cfgTc').value);
  state.config.costoPet = parseFloat(document.getElementById('cfgCostoPet').value);
  state.config.costoPe = parseFloat(document.getElementById('cfgCostoPe').value);
  state.config.costoProceso = parseFloat(document.getElementById('cfgCostoProc').value);
  state.config.capacidadLaminadora = parseFloat(document.getElementById('cfgCapLam').value);
  state.config.capacidadRefiladora = parseFloat(document.getElementById('cfgCapRef').value);
  state.config.pesoConoDefault = parseFloat(document.getElementById('cfgPesoCono').value);
  state.config.mailAgustin = document.getElementById('cfgMailAg').value;
  state.config.mailJonathan = document.getElementById('cfgMailJo').value;
  state.config.diasAlertaOp = parseInt(document.getElementById('cfgDiasAlerta').value);
  state.config.pctAlertaDesviacion = parseFloat(document.getElementById('cfgPctAlerta').value);
  saveState();
  alert('Configuración guardada.');
}

function exportarBackup(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `winflex_op_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function importarBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('¿Reemplazar todos los datos actuales?')) return;
      state = data;
      saveState();
      alert('Datos importados.');
      navigateTo('dashboard');
    }catch(err){alert('Error: '+err.message)}
  };
  reader.readAsText(file);
}

function resetearDatos(){
  if(!confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return;
  if(!confirm('Última oportunidad. ¿Confirmás?')) return;
  localStorage.removeItem(STORE_KEY);
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState();
  alert('Datos reseteados.');
  navigateTo('dashboard');
}

</script>
